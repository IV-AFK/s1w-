name: Build TWRP for EEBBK S1W (H100)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Runs before anything expensive. A missing device tree used to surface
      # only after a ~40 minute repo sync; now it fails in seconds and prints
      # what the repo actually contains. The tree is located by its signature
      # file, so it does not matter how deep the upload nested it.
      - name: Locate device tree
        run: |
          set -e
          MK=$(find "$GITHUB_WORKSPACE" -name twrp_H100.mk -not -path '*/.git/*' | head -n1)
          if [ -z "$MK" ]; then
            echo "::error::twrp_H100.mk not found - the device tree is not in this repo."
            echo "--- what the repo actually contains ---"
            find "$GITHUB_WORKSPACE" -not -path '*/.git/*' -not -name .git | sort | head -n 200
            exit 1
          fi
          SRC=$(dirname "$MK")
          echo "device tree found at: $SRC"
          echo "DEVICE_TREE=$SRC" >> "$GITHUB_ENV"
          ls -l "$SRC"
          if [ ! -f "$SRC/prebuilt/Image" ]; then
            echo "::error::$SRC/prebuilt/Image is missing."
            echo "It is 17 MB, so it cannot be pasted as text - it has to be"
            echo "uploaded as a file (web upload allows 25 MB per file)."
            exit 1
          fi

      # The stock runner has ~14 GB free. A TWRP 9.0 tree needs far more, so we
      # reclaim the preinstalled SDKs/toolchains we will never use (~40 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache \
                      /usr/local/lib/node_modules \
                      /usr/share/swift
          sudo apt-get clean
          docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 openjdk-8-jdk

          # Android 9's prebuilt clang (clang-4691093) is linked against
          # ncurses 5. Ubuntu 22.04 ships ncurses 6, so the very first compile
          # dies with:
          #   clang.real: error while loading shared libraries: libtinfo.so.5
          # It is not a device tree problem - ninja gets to [0% 70/14744] and
          # stops there. Install the compat packages, and if the archive no
          # longer carries them, point .so.5 at the .so.6 that does exist.
          sudo apt-get install -y -qq libtinfo5 libncurses5 || true
          for lib in libtinfo libncurses; do
            if [ ! -e "/usr/lib/x86_64-linux-gnu/$lib.so.5" ]; then
              real=$(ldconfig -p | awk -v n="$lib.so.6" '$1 == n { print $NF; exit }')
              if [ -n "$real" ]; then
                echo "no $lib.so.5 packaged - linking it to $real"
                sudo ln -sf "$real" "/usr/lib/x86_64-linux-gnu/$lib.so.5"
              fi
            fi
          done
          ldconfig -p | grep -E 'lib(tinfo|ncurses)\.so\.' || true

      - name: repo init + sync
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          export PATH="$HOME/bin:$PATH"
          mkdir -p "$HOME/twrp" && cd "$HOME/twrp"
          git config --global user.name  "ci"
          git config --global user.email "ci@localhost"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          repo sync -j"$(nproc)" --force-sync --no-clone-bundle
          df -h /

      - name: Install device tree
        run: |
          set -e
          mkdir -p "$HOME/twrp/device/eebbk"
          cp -r "$DEVICE_TREE" "$HOME/twrp/device/eebbk/H100"
          DT="$HOME/twrp/device/eebbk/H100"

          # Two fixes the checked-in tree still needs. Patching them here means
          # the build does not depend on the repo being corrected first. Both
          # are idempotent, so running them against an already-fixed tree is a
          # no-op.
          #
          #  1. There is no vendor/twrp in the twrp-9.0 manifest; the TWRP
          #     source tree it ships is vendor/omni.
          #  2. AndroidProducts.mk has to use $(LOCAL_DIR). $(call my-dir) is not
          #     defined yet when build/make/core/product_config.mk reads that
          #     file, so LOCAL_PATH expands to nothing, PRODUCT_MAKEFILES points
          #     at a path that does not exist, and lunch fails with
          #     "Can not locate config makefile for product".
          sed -i 's|vendor/twrp/config/common.mk|vendor/omni/config/common.mk|' "$DT/twrp_H100.mk"
          sed -i 's|\$(LOCAL_PATH)/twrp_H100.mk|$(LOCAL_DIR)/twrp_H100.mk|'   "$DT/AndroidProducts.mk"

          echo "--- effective product config ---"
          grep -n 'inherit-product' "$DT/twrp_H100.mk"
          grep -n 'twrp_H100.mk'    "$DT/AndroidProducts.mk"
          ls -l "$DT"

      # AOSP 9's build tools are Python 2. build/make/tools/
      # check_radio_versions.py, which android-info.txt generation calls, uses
      # `print "..."`. Ubuntu 22.04 ships Python 3 as /usr/bin/python, so the
      # first such tool the build reaches dies with
      #   SyntaxError: Missing parentheses in call to 'print'
      # Prefer a real python2. If the archive no longer carries one, convert
      # the py2 build tools in place instead - that is enough because only a
      # handful of them are ever invoked during a recovery build.
      - name: Provide python 2
        run: |
          cd "$HOME/twrp"

          sudo apt-get install -y -qq python2 \
            || sudo apt-get install -y -qq python2.7 \
            || true

          if python --version 2>&1 | grep -q 'Python 2'; then
            echo "python already resolves to Python 2"
            python --version 2>&1
            exit 0
          fi

          for cand in python2 python2.7; do
            if command -v "$cand" >/dev/null 2>&1; then
              echo "pointing python at $cand"
              sudo ln -sf "$(command -v "$cand")" /usr/local/bin/python
              python --version 2>&1
              exit 0
            fi
          done

          echo "no python2 available - converting the py2 build tools in place"
          python3 -m lib2to3 -w -n build/make/tools >/dev/null 2>&1 || true
          python --version 2>&1 || true

      - name: Build recoveryimage
        run: |
          cd "$HOME/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export _JAVA_OPTIONS="-Xmx4g"
          source build/envsetup.sh
          lunch twrp_H100-eng
          set -o pipefail
          mka recoveryimage -j"$(nproc)" 2>&1 | tee out/build.log
          ls -l out/target/product/H100/recovery.img

      - uses: actions/upload-artifact@v4
        with:
          name: twrp-H100-recovery
          path: ~/twrp/out/target/product/H100/recovery.img
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/twrp/out/build.log
            ~/twrp/out/error.log
            ~/twrp/out/verbose.log.gz
            ~/twrp/out/*.log
          if-no-files-found: ignore
